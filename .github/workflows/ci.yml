name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pandas pyarrow pandera python-dotenv pyyaml

      - name: Create minimal config.yaml for CI
        run: cp config.yaml.example config.yaml

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Unit Tests
        run: |
          pytest -m unit -v

      - name: Run Data Quality Tests (Pandera schemas)
        run: |
          pytest tests/data_quality/ -v --tb=short
