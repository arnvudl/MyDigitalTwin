<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Builder — MyDigitalTwin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg:      #09090b;
            --bg2:     #111113;
            --bg3:     #18181b;
            --bg4:     #222226;
            --border:  rgba(255,255,255,0.06);
            --border2: rgba(255,255,255,0.11);
            --border3: rgba(255,255,255,0.18);
            --text:    #f4f3ef;
            --text2:   #7c7a72;
            --text3:   #4a4845;
            --accent:  #6d5ef5;
            --accent2: #9b8ff7;
            --me-bg:   #261f58;
            --me-text: #c4b8ff;
            --them-bg: #18181b;
            --ig: #e1306c; --tt: #5ee7df;
            --radius-sm: 6px; --radius-md: 12px; --radius-lg: 18px;
            --select-bg: rgba(109, 94, 245, 0.2);
            --select-border: #6d5ef5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.5;
        }

        #rail { width: 56px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px; flex-shrink: 0; }
        .rail-btn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border2); background: var(--bg3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; transition: all .18s; color: var(--text2); }
        .rail-btn.active-ig { border-color: var(--ig); background: rgba(225,48,108,.12); }
        .rail-btn.active-tt { border-color: var(--tt); background: rgba(94,231,223,.1); }

        #sidebar { width: 270px; min-width: 270px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        #conv-list { flex: 1; overflow-y: auto; }
        .ci { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; transition: background .1s; }
        .ci:hover { background: var(--bg3); }
        .ci.active { background: rgba(109,94,245,.1); }

        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--bg); }
        #mc { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; }

        #selection-panel { width: 350px; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        #sel-head { padding: 18px; border-bottom: 1px solid var(--border); }
        #sel-head h2 { font-size: 14px; font-weight: 600; color: var(--accent2); }
        #sel-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .sel-item { background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px; position: relative; font-size: 11px; }
        .sel-item .remove { position: absolute; top: 5px; right: 5px; cursor: pointer; opacity: 0.5; }
        .sel-item .remove:hover { opacity: 1; color: #ff4d4d; }

        #sel-footer { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .btn-export { background: var(--accent); color: white; border: none; padding: 10px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; width: 100%; }

        .mr { display: flex; align-items: flex-end; gap: 6px; cursor: pointer; transition: transform 0.1s; padding: 4px 8px; border-radius: var(--radius-sm); }
        .mr.selected { background: var(--select-bg); outline: 1px solid var(--select-border); }
        .bbl { max-width: 85%; padding: 8px 13px; border-radius: var(--radius-md); font-size: 13px; word-break: break-word; }
        .mr.me .bbl { background: var(--me-bg); color: var(--me-text); border-bottom-right-radius: 3px; }
        .mr.them .bbl { background: var(--bg3); color: var(--text); border-bottom-left-radius: 3px; border: 1px solid var(--border2); }
        .mr.me { flex-direction: row-reverse; }
        .mt { font-size: 9px; color: var(--text3); font-family: 'JetBrains Mono', monospace; opacity: 0.5; }

        #ch { padding: 13px 22px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; justify-content: space-between; }
        .ch-id-badge { background: var(--bg3); border: 1px solid var(--border2); padding: 4px 8px; border-radius: 4px; font-size: 10px; color: var(--text3); display: flex; align-items: center; gap: 8px; }
        .btn-flip { background: var(--accent); border: none; color: white; font-size: 9px; padding: 2px 6px; border-radius: 3px; cursor: pointer; }

        #dz { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 10; }
        #dz.hide { display: none; }
        #help-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 20px; border-radius: 30px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none; }
        #help-toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="rail">
    <div class="rail-btn active-ig" id="rb-ig" onclick="switchPlat('ig')">📸</div>
    <div class="rail-btn" id="rb-tt" onclick="switchPlat('tt')">🎵</div>
</div>

<div id="sidebar">
    <div style="padding: 18px; border-bottom: 1px solid var(--border);">
        <h1 style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2);">Dataset Builder</h1>
    </div>
    <div id="conv-list"></div>
</div>

<div id="main">
    <div id="dz">
        <h2>Préparer ton Clone</h2>
        <p style="margin: 10px 0 20px; color: var(--text3); text-align: center;">Glisse tes fichiers JSON ici.</p>
        <button class="btn-export" style="width: auto; padding: 10px 30px;" onclick="document.getElementById('fi').click()">Ouvrir les fichiers</button>
        <input id="fi" type="file" multiple onchange="loadFiles(this.files)" style="display:none">
    </div>

    <div id="ch" style="display:none">
        <div>
            <div id="ch-title" style="font-weight: 600;">Conversation</div>
            <div class="ch-id-badge">
                <span>Identifié comme : <b id="my-name-display" style="color:var(--accent2)">...</b></span>
                <button class="btn-flip" onclick="flipRoles()">Inverser les rôles</button>
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button onclick="clearSelection()" style="background: var(--bg4); color: var(--text2); border: 1px solid var(--border2); padding: 5px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 11px;">Annuler</button>
            <button onclick="validateGroup()" style="background: var(--accent); color: white; border: none; padding: 5px 15px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 11px;">Valider le bloc</button>
        </div>
    </div>
    <div id="mc" style="display:none"></div>
</div>

<div id="selection-panel">
    <div id="sel-head">
        <h2>Mon Dataset (Clone)</h2>
        <div id="sel-stats" style="font-size: 10px; color: var(--text3); margin-top: 4px;">0 conversations</div>
    </div>
    <div id="sel-list"></div>
    <div id="sel-footer">
        <button class="btn-export" onclick="exportJSONL()">Exporter dataset.jsonl</button>
    </div>
</div>

<div id="help-toast">Conversation ajoutée !</div>

<script>
    let convs = {ig: {}, tt: {}};
    let plat = 'ig', activeCid = null;
    let myNameIg = null, myNameTt = null;
    let dataset = [];
    let selectedMessages = [];

    const fix = s => { try { return decodeURIComponent(escape(s)); } catch { return s; } };

    async function loadFiles(files) {
        for (const f of files) {
            const txt = await f.text();
            if (f.name.includes('tiktok') || f.name.includes('user_data')) await parseTT(txt);
            else await parseIG(txt, f);
        }
        document.getElementById('dz').classList.add('hide');
        renderSidebar();
    }

    async function parseIG(txt, file) {
        let data = JSON.parse(txt);
        if (!data.messages) return;
        const cid = file.name + '_' + data.title;
        if (!convs.ig[cid]) convs.ig[cid] = { title: fix(data.title), messages: [] };
        convs.ig[cid].messages.push(...data.messages);
        if (!myNameIg) {
            let cnt = {};
            data.messages.forEach(m => { let s = fix(m.sender_name); if(s) cnt[s] = (cnt[s]||0)+1; });
            myNameIg = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0];
        }
        convs.ig[cid].messages.sort((a,b) => a.timestamp_ms - b.timestamp_ms);
    }

    async function parseTT(txt) {
        let data = JSON.parse(txt);
        const ch = data?.['Direct Message']?.['Direct Messages']?.['ChatHistory'] || {};
        for (const [key, msgs] of Object.entries(ch)) {
            const other = key.match(/with\s+(.+?):/i)?.[1] || key;
            convs.tt[other] = { title: other, messages: msgs.sort((a,b)=>new Date(a.Date)-new Date(b.Date)) };
        }
        if (!myNameTt) {
            let cnt = {};
            Object.values(convs.tt).forEach(c => c.messages.forEach(m => { let f = m.From; if(f) cnt[f] = (cnt[f]||0)+1; }));
            myNameTt = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0];
        }
    }

    function switchPlat(p) {
        plat = p;
        document.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('active-ig', 'active-tt'));
        document.getElementById(`rb-${p}`).classList.add(`active-${p}`);
        renderSidebar();
    }

    function renderSidebar() {
        const list = document.getElementById('conv-list');
        list.innerHTML = '';
        Object.entries(convs[plat]).forEach(([id, c]) => {
            const div = document.createElement('div');
            div.className = 'ci' + (id === activeCid ? ' active' : '');
            div.innerHTML = `<div class="ci-info"><div class="ci-name">${c.title}</div><div class="ci-sub">${c.messages.length} msg</div></div>`;
            div.onclick = () => openConv(id);
            list.appendChild(div);
        });
    }

    function openConv(id) {
        activeCid = id;
        document.getElementById('ch').style.display = 'flex';
        document.getElementById('mc').style.display = 'flex';
        document.getElementById('ch-title').textContent = convs[plat][id].title;
        document.getElementById('my-name-display').textContent = plat === 'ig' ? myNameIg : myNameTt;
        renderMsgs();
        renderSidebar();
    }

    function flipRoles() {
        if (plat === 'ig') {
            const names = new Set();
            convs.ig[activeCid].messages.forEach(m => names.add(fix(m.sender_name)));
            const others = Array.from(names).filter(n => n !== myNameIg);
            if (others.length > 0) myNameIg = others[0];
        } else {
            const names = new Set();
            convs.tt[activeCid].messages.forEach(m => names.add(m.From));
            const others = Array.from(names).filter(n => n !== myNameTt);
            if (others.length > 0) myNameTt = others[0];
        }
        document.getElementById('my-name-display').textContent = plat === 'ig' ? myNameIg : myNameTt;
        renderMsgs();
    }

    function renderMsgs() {
        const mc = document.getElementById('mc');
        mc.innerHTML = '';
        const msgs = convs[plat][activeCid].messages;
        const myName = plat === 'ig' ? myNameIg : myNameTt;
        msgs.forEach((m, i) => {
            const sender = plat === 'ig' ? fix(m.sender_name) : m.From;
            const isMe = sender === myName;
            const text = plat === 'ig' ? fix(m.content) : m.Content;
            if (!text) return;

            const row = document.createElement('div');
            row.className = `mr ${isMe ? 'me' : 'them'}`;
            row.dataset.idx = i;
            row.innerHTML = `<div class="bbl">${text}</div><div class="mt">${new Date(plat==='ig'?m.timestamp_ms:m.Date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
            row.onclick = () => toggleMessageSelection(row);
            mc.appendChild(row);
        });
        mc.scrollTop = mc.scrollHeight;
    }

    function toggleMessageSelection(el) {
        const idx = parseInt(el.dataset.idx);
        const text = el.querySelector('.bbl').innerText;
        const isMe = el.classList.contains('me');
        const existingIdx = selectedMessages.findIndex(m => m.idx === idx);
        if (existingIdx > -1) {
            selectedMessages.splice(existingIdx, 1);
            el.classList.remove('selected');
        } else {
            selectedMessages.push({ isMe, text, idx });
            el.classList.add('selected');
        }
        selectedMessages.sort((a, b) => a.idx - b.idx);
    }

    function clearSelection() {
        selectedMessages = [];
        document.querySelectorAll('.mr.selected').forEach(r => r.classList.remove('selected'));
    }

    function validateGroup() {
        if (selectedMessages.length === 0) return;
        const chat = selectedMessages.map(m => ({
            role: m.isMe ? "assistant" : "user",
            content: m.text
        }));
        dataset.push({ messages: chat });
        renderDataset();
        clearSelection();
        showToast();
    }

    function renderDataset() {
        const list = document.getElementById('sel-list');
        list.innerHTML = '';
        dataset.forEach((conv, i) => {
            const div = document.createElement('div');
            div.className = 'sel-item';
            let html = `<span class="remove" onclick="removePair(${i})">✕</span><div class="pair">`;
            conv.messages.forEach(m => {
                const color = m.role === 'assistant' ? 'var(--me-text)' : 'var(--text2)';
                const label = m.role === 'assistant' ? 'Message Arnaud' : 'Message de ton pote';
                html += `<div style="font-size:10px; color:${color}; margin-bottom:2px;"><b>${label}:</b> ${m.content}</div>`;
            });
            html += `</div>`;
            div.innerHTML = html;
            list.appendChild(div);
        });
        document.getElementById('sel-stats').textContent = `${dataset.length} conversations`;
    }

    function removePair(i) { dataset.splice(i, 1); renderDataset(); }
    function showToast() { const t = document.getElementById('help-toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); }
    function exportJSONL() {
        if (dataset.length === 0) return;
        const blob = new Blob([dataset.map(JSON.stringify).join('\n')], { type: 'application/x-jsonlines' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dataset_arnaud_chat.jsonl';
        a.click();
    }
</script>
</body>
</html>
