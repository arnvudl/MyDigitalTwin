<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; }
    #g { width:100vw; height:100vh; display:block; }

    /* ── Nodes overlay ─────────────────────────────────────────────────────── */
    #nodes-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      pointer-events: none; z-index: 10; overflow: hidden;
    }

    /* ── Cluster nodes ─────────────────────────────────────────────────────── */
    .nc {
      position: absolute; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.80);
      box-shadow: 0 0 24px rgba(255,255,255,0.08), inset 0 0 16px rgba(255,255,255,0.03);
      cursor: pointer; pointer-events: auto;
      transition: border-color .15s, box-shadow .15s, opacity .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .nc:hover { border-color: #fff; box-shadow: 0 0 36px rgba(255,255,255,0.28); }
    .nc.dim   { opacity: .18; }
    .nc-label {
      position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%); margin-top: 5px;
      font-size: 9px; font-weight: 700; letter-spacing: .3px;
      color: rgba(255,255,255,.75); white-space: nowrap;
      text-shadow: 0 1px 6px #000, 0 0 10px #000; pointer-events: none;
    }
    .nc-count {
      font-size: 10px; font-weight: 700; color: rgba(255,255,255,.55);
      pointer-events: none;
    }

    /* ── Item nodes ────────────────────────────────────────────────────────── */
    .ni {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.30);
      background: rgba(255,255,255,.14) center/cover no-repeat;
      cursor: pointer; pointer-events: auto;
      transition: transform .12s, opacity .15s, border-color .12s;
    }
    .ni:hover { border-color: rgba(255,255,255,.9); z-index: 9999 !important; }
    .ni.dim   { opacity: .08; }

    /* ── Lens bar ──────────────────────────────────────────────────────────── */
    #lens-bar {
      position: fixed; top:18px; left:50%; transform:translateX(-50%);
      z-index:300; display:flex; gap:6px;
      background:rgba(0,0,0,.82); backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,.12); border-radius:30px; padding:5px;
    }
    .lens-btn {
      padding:7px 18px; border-radius:24px; border:none; cursor:pointer;
      font-size:12px; font-weight:600; letter-spacing:.5px;
      color:rgba(255,255,255,.45); background:transparent; transition:all .2s;
    }
    .lens-btn:hover { color:rgba(255,255,255,.85); background:rgba(255,255,255,.06); }
    .lens-btn.active {
      background:rgba(255,255,255,.12); color:#fff;
      border:1px solid rgba(255,255,255,.28);
    }

    /* ── Stats ─────────────────────────────────────────────────────────────── */
    #stats {
      position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
      font-size:11px; color:rgba(255,255,255,.28); pointer-events:none;
      letter-spacing:.3px; text-shadow:0 1px 4px #000; white-space:nowrap;
    }

    /* ── Detail panel ──────────────────────────────────────────────────────── */
    #detail {
      position:fixed; top:0; right:0; bottom:0; width:340px;
      background:rgba(0,0,0,.96); border-left:1px solid rgba(255,255,255,.10);
      padding:28px 20px; overflow-y:auto;
      transform:translateX(100%); transition:transform .35s cubic-bezier(.16,1,.3,1);
      z-index:200; display:flex; flex-direction:column; gap:16px;
    }
    #detail.open { transform:translateX(0); }
    #detail-close {
      position:absolute; top:16px; right:16px; width:28px; height:28px;
      border-radius:50%; background:rgba(255,255,255,.07); border:none;
      color:rgba(255,255,255,.5); cursor:pointer; font-size:14px;
      display:flex; align-items:center; justify-content:center;
    }
    #detail-close:hover { background:rgba(255,255,255,.14); color:#fff; }
    #detail-title  { font-size:18px; font-weight:700; color:#fff; padding-right:32px; }
    #detail-meta   { font-size:12px; color:rgba(255,255,255,.38); }
    #detail-sep    { height:1px; background:rgba(255,255,255,.08); border:none; }
    .d-section     { font-size:10px; font-weight:700; letter-spacing:1.5px;
                     text-transform:uppercase; color:rgba(255,255,255,.28);
                     margin-bottom:10px; }
    .item-card {
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
      border-radius:10px; padding:10px 12px; display:flex; gap:10px;
      align-items:flex-start; margin-bottom:8px;
    }
    .item-thumb {
      width:44px; height:44px; border-radius:8px; flex-shrink:0;
      background:rgba(255,255,255,.08) center/cover no-repeat;
      border:1px solid rgba(255,255,255,.08);
    }
    .item-info { flex:1; min-width:0; }
    .item-text { font-size:12px; color:rgba(255,255,255,.78); line-height:1.4; margin-bottom:4px; }
    .item-row  { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .item-plat { font-size:10px; color:rgba(255,255,255,.32); }
    .item-link { font-size:10px; color:rgba(255,255,255,.28); text-decoration:none; }
    .item-link:hover { color:rgba(255,255,255,.7); }
  </style>
</head>
<body>
  <div id="g"></div>
  <div id="nodes-overlay"></div>

  <div id="lens-bar">
    <button class="lens-btn"        data-lens="time">⏱ Temporel</button>
    <button class="lens-btn"        data-lens="platform">🌐 Plateformes</button>
    <button class="lens-btn active" data-lens="density">🔭 Densité</button>
  </div>

  <div id="stats"></div>

  <div id="detail">
    <button id="detail-close" onclick="closeDetail()">✕</button>
    <div id="detail-title">—</div>
    <div id="detail-meta"></div>
    <hr id="detail-sep"/>
    <div class="d-section">Éléments du cluster</div>
    <div id="detail-items-list"></div>
  </div>

  <script src="/assets/3d-force-graph.min.js"></script>
  <script>
    const RAW = __TOPOLOGY_DATA__;

    // ── State ─────────────────────────────────────────────────────────────────
    let Graph          = null;
    let hoveredCluster = null;      // cluster id hovered
    const nodeDivs     = new Map(); // node.id → DOM element

    // ── 3D → 2D projection (pure maths, no THREE ref needed) ─────────────────
    function project3D(x, y, z) {
      if (!Graph) return null;
      const cam = Graph.camera();
      const ren = Graph.renderer();
      if (!cam || !ren) return null;

      const mv = cam.matrixWorldInverse.elements;
      const pr = cam.projectionMatrix.elements;

      const vx = mv[0]*x + mv[4]*y + mv[8]*z  + mv[12];
      const vy = mv[1]*x + mv[5]*y + mv[9]*z  + mv[13];
      const vz = mv[2]*x + mv[6]*y + mv[10]*z + mv[14];
      const vw = mv[3]*x + mv[7]*y + mv[11]*z + mv[15];

      const cx = pr[0]*vx + pr[4]*vy + pr[8]*vz  + pr[12]*vw;
      const cy = pr[1]*vx + pr[5]*vy + pr[9]*vz  + pr[13]*vw;
      const cz = pr[2]*vx + pr[6]*vy + pr[10]*vz + pr[14]*vw;
      const cw = pr[3]*vx + pr[7]*vy + pr[11]*vz + pr[15]*vw;

      if (cw <= 0) return null;
      const W = ren.domElement.clientWidth  || window.innerWidth;
      const H = ren.domElement.clientHeight || window.innerHeight;
      return {
        x:  (cx / cw * 0.5 + 0.5) * W,
        y: (-cy / cw * 0.5 + 0.5) * H,
        nz:  cz / cw,
      };
    }

    // ── Node DOM sync (RAF loop) ──────────────────────────────────────────────
    function syncNodes() {
      if (!Graph) { requestAnimationFrame(syncNodes); return; }

      const overlay = document.getElementById('nodes-overlay');
      const nodes   = Graph.graphData()?.nodes || [];
      const seen    = new Set();

      nodes.forEach(node => {
        if (node.x == null) return;
        seen.add(node.id);

        // Create element on first encounter
        if (!nodeDivs.has(node.id)) {
          nodeDivs.set(node.id, makeDiv(node, overlay));
        }

        const el  = nodeDivs.get(node.id);
        const pos = project3D(node.x, node.y, node.z);

        if (!pos || pos.nz > 1) { el.style.display = 'none'; return; }

        const depth = Math.max(0, Math.min(1, (pos.nz + 1) / 2));
        const dsc   = 1 - depth * 0.45; // depth scale 0.55–1.0

        el.style.display = '';
        el.style.zIndex  = String(Math.round((1 - depth) * 800) + (node.type === 'cluster' ? 200 : 0));

        if (node.type === 'cluster') {
          const S = Math.round((42 + Math.sqrt(node.size || 1) * 1.8) * dsc);
          el.style.width  = S + 'px';
          el.style.height = S + 'px';
          el.style.left   = (pos.x - S / 2) + 'px';
          el.style.top    = (pos.y - S / 2) + 'px';
          el.classList.toggle('dim', !!(hoveredCluster && node.id !== hoveredCluster));

        } else { // item
          const S = Math.round(20 * dsc);
          el.style.width  = S + 'px';
          el.style.height = S + 'px';
          el.style.left   = (pos.x - S / 2) + 'px';
          el.style.top    = (pos.y - S / 2) + 'px';
          el.classList.toggle('dim', !!(hoveredCluster && node.cluster !== hoveredCluster));
        }
      });

      // Remove stale divs
      nodeDivs.forEach((el, id) => {
        if (!seen.has(id)) { el.remove(); nodeDivs.delete(id); }
      });

      requestAnimationFrame(syncNodes);
    }

    function makeDiv(node, overlay) {
      const el = document.createElement('div');

      if (node.type === 'cluster') {
        el.className = 'nc';
        const lbl = document.createElement('div');
        lbl.className = 'nc-label';
        lbl.textContent = node.label || '';
        el.appendChild(lbl);
        const cnt = document.createElement('div');
        cnt.className = 'nc-count';
        cnt.textContent = node.size;
        el.appendChild(cnt);

        el.addEventListener('mouseenter', () => { hoveredCluster = node.id; });
        el.addEventListener('mouseleave', () => { hoveredCluster = null; });
        el.addEventListener('click',      (e) => { e.stopPropagation(); openDetail(node); });

      } else { // item
        el.className = 'ni';
        if (node.image_url) {
          el.style.backgroundImage = `url(${node.image_url})`;
          el.style.backgroundColor = 'transparent';
        }
        // Highlight parent cluster on item hover
        el.addEventListener('mouseenter', () => { hoveredCluster = node.cluster || null; });
        el.addEventListener('mouseleave', () => { hoveredCluster = null; });
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (node.url && node.url !== 'None') window.open(node.url, '_blank');
        });
        el.title = node.text ? node.text.slice(0, 80) : node.platform;
      }

      overlay.appendChild(el);
      return el;
    }

    // ── Link helpers ──────────────────────────────────────────────────────────
    function linkColor(l) {
      if (l.type === 'cc') {
        if (!hoveredCluster) return 'rgba(255,255,255,0.55)';
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        return (s === hoveredCluster || t === hoveredCluster)
          ? 'rgba(255,255,255,0.95)'
          : 'rgba(255,255,255,0.06)';
      }
      // ci edges
      if (!hoveredCluster) return 'rgba(255,255,255,0.10)';
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      const cid = l._clusterId || (l.type === 'ci' ? s : null);
      return cid === hoveredCluster
        ? 'rgba(255,255,255,0.50)'
        : 'rgba(255,255,255,0.02)';
    }
    function linkWidth(l) {
      if (l.type === 'cc') {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        const hi = hoveredCluster && (s === hoveredCluster || t === hoveredCluster);
        return hi ? 3.0 + (l.weight || 1) * 0.4 : 1.6 + (l.weight || 1) * 0.3;
      }
      return 0.5; // thin ci edges
    }

    // ── Load lens ─────────────────────────────────────────────────────────────
    function loadLens(lens) {
      const ld = RAW[lens];
      if (!ld) return;

      // Annotate ci links with cluster id for highlight
      ld.links.forEach(l => {
        if (l.type === 'ci') {
          l._clusterId = typeof l.source === 'object' ? l.source.id : l.source;
        }
      });

      if (!Graph) {
        initGraph(ld);
      } else {
        closeDetail();
        hoveredCluster = null;
        nodeDivs.forEach(d => d.remove()); nodeDivs.clear();
        Graph.graphData(ld);
        Graph.linkColor(linkColor).linkWidth(linkWidth);
      }

      const m = ld.meta || {};
      document.getElementById('stats').textContent =
        `${(m.n_items || 0).toLocaleString()} items · ` +
        `${m.n_clusters || 0} clusters · ` +
        `${m.n_item_nodes || 0} nœuds affichés · ` +
        `${m.n_cc_edges || 0} connexions`;
    }

    // ── Init ForceGraph3D ─────────────────────────────────────────────────────
    function initGraph(data) {
      Graph = ForceGraph3D({ controlType: 'orbit' })(document.getElementById('g'))
        .graphData(data)
        .backgroundColor('#000000')
        .showNavInfo(false)
        // All spheres invisible — DOM overlay handles visuals
        .nodeColor(() => 'rgba(0,0,0,0)')
        .nodeOpacity(0)
        .nodeRelSize(3)
        .nodeVal(n => n.type === 'cluster' ? Math.max(4, n.val || 4) : 1)
        .nodeLabel(() => '')
        // Links: 3d-force-graph renders these (WebGL edges)
        .linkColor(linkColor)
        .linkWidth(linkWidth)
        .linkDirectionalParticles(l => l.type === 'cc' ? Math.min(5, (l.weight || 1) + 1) : 0)
        .linkDirectionalParticleWidth(2.2)
        .linkDirectionalParticleColor(() => 'rgba(255,255,255,0.75)')
        .linkDirectionalParticleSpeed(0.005)
        .onNodeHover(() => {})
        .onNodeClick(() => {})
        .onBackgroundClick(() => { closeDetail(); hoveredCluster = null; });

      // Physics: clusters repel strongly, items cluster tightly around parent
      Graph.d3Force('link').distance(l => l.type === 'cc' ? 280 : 85);
      Graph.d3Force('charge').strength(n => n.type === 'cluster' ? -600 : -35);
      Graph.d3VelocityDecay(0.30);
      Graph.d3AlphaDecay(0.015);

      // No auto-rotation
      Graph.controls().autoRotate = false;

      setTimeout(() => Graph.zoomToFit(1200, 80), 4500);

      // Start DOM sync RAF
      requestAnimationFrame(syncNodes);
    }

    // ── Detail panel ──────────────────────────────────────────────────────────
    function openDetail(clusterNode) {
      document.getElementById('detail-title').textContent = clusterNode.label || '—';
      document.getElementById('detail-meta').textContent  =
        `${clusterNode.size} éléments · ${clusterNode.platform}`;

      const items = (Graph.graphData()?.nodes || [])
        .filter(n => n.cluster === clusterNode.id);

      const list = document.getElementById('detail-items-list');
      list.innerHTML = '';
      if (!items.length) {
        list.innerHTML = '<p style="font-size:12px;color:rgba(255,255,255,.28)">Aucun élément</p>';
        return;
      }
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        const text = (item.text || '—').slice(0, 100);
        const url  = (item.url && item.url !== 'None') ? item.url : '';
        card.innerHTML = `
          ${item.image_url
            ? `<div class="item-thumb" style="background-image:url(${item.image_url})"></div>`
            : `<div class="item-thumb"></div>`}
          <div class="item-info">
            <div class="item-text">${text}</div>
            <div class="item-row">
              <span class="item-plat">${item.platform}</span>
              ${url ? `<a class="item-link" href="${url}" target="_blank">↗ Ouvrir</a>` : ''}
            </div>
          </div>`;
        list.appendChild(card);
      });
      document.getElementById('detail').classList.add('open');
    }

    function closeDetail() {
      document.getElementById('detail').classList.remove('open');
    }

    // ── Lens buttons ──────────────────────────────────────────────────────────
    document.querySelectorAll('.lens-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lens-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadLens(btn.dataset.lens);
      });
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    loadLens('density');
  </script>
</body>
</html>
